<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Облака — проверка по кругу</title>
<style>:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#17151d;color:#f5edf2}*{box-sizing:border-box}body{margin:0;padding:24px;min-width:1100px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:20px}h1{font-size:25px;margin:0 0 7px}p,footer{font-size:13px;color:#bbb0c2;margin:0}nav{display:flex;gap:8px}button,a{color:#f5d3b3;background:#302731;border:1px solid #665166;border-radius:6px;padding:10px 12px;text-decoration:none;cursor:pointer}button[aria-pressed=true]{background:#f5d3b3;color:#302731}main{display:grid;grid-template-columns:1fr 1fr;gap:16px}h2{font-size:15px;margin:0 0 9px}img{display:block;width:100%;height:auto}footer{margin-top:14px}</style></head><body>
<header><div><h1>Облака · исправление разрывов</h1><p>Одинаковые камеры и время сцены · реальные снимки игры</p></div><nav><button id="compare" aria-pressed="true">До / после</button><button id="around" aria-pressed="false">Четыре стороны</button><a href="http://127.0.0.1:5174/?day=1" target="_blank">Игра ↗</a></nav></header>
<main><section><h2>До · боковой ракурс</h2><img src="before-side.jpg" alt="Боковой ракурс до исправления"></section><section><h2>После · боковой ракурс</h2><img src="after-side.jpg" alt="Боковой ракурс после исправления"></section><section><h2>До · обратный ракурс</h2><img src="before-back.jpg" alt="Обратный ракурс до исправления"></section><section><h2>После · обратный ракурс</h2><img src="after-back.jpg" alt="Обратный ракурс после исправления"></section></main>
<footer>Исправлено растяжение облачных форм и добавлено общее основание. Визуальный результат — на твою оценку.</footer>
<script>const cards=[...document.querySelectorAll('section')];for(const id of ['compare','around'])document.getElementById(id).onclick=()=>{const around=id==='around';const shots=around?[['after-front','Над моргом'],['after-side','Справа'],['after-back','В обратную сторону'],['after-west','Слева']]:[['before-side','До · боковой ракурс'],['after-side','После · боковой ракурс'],['before-back','До · обратный ракурс'],['after-back','После · обратный ракурс']];cards.forEach((card,i)=>{card.querySelector('h2').textContent=shots[i][1];const img=card.querySelector('img');img.src=shots[i][0]+'.jpg';img.alt=shots[i][1]});for(const mode of ['compare','around'])document.getElementById(mode).setAttribute('aria-pressed',String(mode===id))};</script></body></html>
