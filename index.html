<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XIOMBARD</title>
    <meta name="description" content="A three.js game built from procedural, shader-generated assets." />
    <style>
      :root { --fg: #e8f1ff; --muted: #8fa3c0; --accent: #7cf7ff; }
      html, body { margin: 0; height: 100%; background: #05060c; color: var(--fg); overflow: hidden;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      canvas { display: block; position: fixed; inset: 0; z-index: 0; }
      #ui, #hud { z-index: 1; }
      #ui { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none;
        transition: opacity .6s ease; }
      #ui.hidden { opacity: 0; }
      .panel { text-align: center; padding: 0 16px; pointer-events: auto; }
      h1 { font-size: clamp(40px, 9vw, 104px); letter-spacing: .18em; margin: 0;
        text-shadow: 0 0 24px rgba(124,247,255,.45); }
      p { color: var(--muted); max-width: 520px; margin: 12px auto 28px; line-height: 1.5; }
      button { font: inherit; font-size: 18px; letter-spacing: .12em; padding: 14px 40px; cursor: pointer;
        color: #05060c; background: var(--accent); border: 0; border-radius: 999px;
        box-shadow: 0 0 32px rgba(124,247,255,.5); }
      #hud { position: fixed; left: 16px; bottom: 16px; font-size: 13px; color: var(--muted);
        opacity: 0; transition: opacity .6s; }
      #hud.visible { opacity: 1; }
      kbd { border: 1px solid #33415c; border-radius: 4px; padding: 1px 6px; }
    </style>
  </head>
  <body>
    <div id="ui">
      <div class="panel">
        <h1>XIOMBARD</h1>
        <p>Every pixel here is generated by code — shaders, noise and math. No purchased assets.</p>
        <button id="play">PLAY</button>
      </div>
    </div>
    <div id="hud">Move <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> · Look: mouse / drag · Collect the crystals · <span id="score">0</span></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
